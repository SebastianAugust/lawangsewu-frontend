<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline - Lawang Sewu</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f8fafc;
        color: #334155;
      }
      .container {
        text-align: center;
        padding: 2rem;
      }
      .icon {
        font-size: 4rem;
        margin-bottom: 1rem;
      }
      h1 {
        font-size: 1.5rem;
        margin-bottom: 0.5rem;
      }
      p {
        color: #94a3b8;
        font-size: 0.9rem;
        margin-bottom: 1.5rem;
      }
      button {
        background: #f59e0b;
        color: white;
        border: none;
        padding: 0.75rem 2rem;
        border-radius: 0.75rem;
        font-size: 0.9rem;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover {
        background: #d97706;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="icon">📡</div>
      <h1>Tidak Ada Koneksi</h1>
      <p>
        Pastikan perangkat terhubung ke internet untuk menggunakan Lawang Sewu
        POS.
      </p>
      <button onclick="location.reload()">Coba Lagi</button>
    </div>
  </body>
</html>
